<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>insanelyharsh blogs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="blog_list.html" class="navbar__title">insanelyharsh blogs</a>
  </header>

  <main class="blog-list" id="blog-list"></main>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("blog-list");
      fetchBlogList()
        .then((items) => renderBlogList(container, items))
        .catch((err) => renderError(container, err));
    });
  </script>
</body>
</html>
