<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insane Blogs</title>
  <script>
    (function () {
      var KEY = "blog-theme";
      var stored = localStorage.getItem(KEY);
      var theme = stored === "light" || stored === "dark"
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="blog_list.html" class="navbar__title">Insane Blogs</a>
    <div class="navbar__actions">
      <a href="https://insanelyharsh.com" class="navbar__link">Portfolio</a>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle color theme"></button>
    </div>
  </header>

  <main class="post">
    <article class="post__content" id="post-content"></article>
    <section class="comments" id="comments" aria-label="Comments"></section>
  </main>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script src="app.js"></script>
  <script src="comments.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const postContainer = document.getElementById("post-content");
      const commentsContainer = document.getElementById("comments");
      const slug = new URLSearchParams(location.search).get("slug");

      if (!slug) {
        renderError(postContainer, new Error("Missing slug in URL"));
        return;
      }

      fetchBlogBySlug(slug)
        .then((html) => renderBlogPost(postContainer, html))
        .catch((err) => renderError(postContainer, err));

      initComments(commentsContainer, slug);
    });
  </script>
</body>
</html>
