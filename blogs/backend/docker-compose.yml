services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - blog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  webserver:
    image: insanelyharsh/web-portfolio-blog-backend:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${PORT:-8080}
      # Overrides the .env copy of DATABASE_URL (meant for `go run ./cmd` on
      # the host) so the containerized webserver reaches Postgres by its
      # compose service name instead of localhost.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  blog-postgres-data:
