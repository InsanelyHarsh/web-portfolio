name: Build & Push - Blogs Backend

on:
  push:
    branches: [main]
    paths:
      - 'blogs/backend/**'
      - '.github/workflows/blogs-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'blogs/backend/**'
      - '.github/workflows/blogs-backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: blogs/backend/go.mod

      - name: Run tests
        working-directory: blogs/backend
        run: go test ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on merge to main)
        uses: docker/build-push-action@v6
        with:
          context: ./blogs/backend
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            insanelyharsh/blogs-backend:latest
            insanelyharsh/blogs-backend:${{ github.sha }}
